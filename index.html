<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>山森惇人くん 頑張って</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    height:100vh;
    overflow:hidden;

    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;

    background:
    radial-gradient(circle at center,
    #2d0000 0%,
    #100000 50%,
    #000000 100%);

    color:white;
    font-family:
    "Hiragino Sans",
    sans-serif;

}

/* 背景パーティクル */

body::before{

    content:"";

    position:fixed;
    inset:0;

    background-image:
    radial-gradient(
    rgba(255,255,255,.8) 1px,
    transparent 1px);

    background-size:40px 40px;

    opacity:.15;

    animation:
    particleMove 15s linear infinite;

    pointer-events:none;
}

@keyframes particleMove{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-40px);
    }
}

/* オープニング */

#mission{

    position:fixed;

    inset:0;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    background:black;

    z-index:999;

    font-size:1.6rem;

    text-align:center;

    line-height:2;

    animation:
    fadeout 1s ease 3s forwards;
}

@keyframes fadeout{

    to{
        opacity:0;
        visibility:hidden;
    }
}

/* タイトル */

.title{

    margin-top:20px;

    text-align:center;

    color:#ff4040;

    font-size:2rem;

    font-weight:bold;

    text-shadow:
    0 0 10px red,
    0 0 20px orange,
    0 0 30px yellow;

    animation:
    fire 1s infinite alternate;
}

@keyframes fire{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-4px);
    }
}

/* ALL OR NOTHING */

.slogan{

    margin-top:8px;

    font-size:1.2rem;

    font-weight:bold;

    color:white;

    animation:
    blink 1s infinite;
}

@keyframes blink{

    0%{
        opacity:1;
    }

    50%{
        opacity:.2;
    }

    100%{
        opacity:1;
    }
}

/* キャラ */

.character-wrap{

    position:relative;
    text-align:center;
}

.character{

    width:min(70vw,320px);

    border-radius:50%;

    cursor:pointer;

    filter:
    drop-shadow(0 0 20px gold);

    transition:.2s;
}

.character:active{

    transform:scale(.95);
}

.tap{

    margin-top:10px;

    opacity:.8;
}

/* 吹き出し */

.balloon{

    position:absolute;

    left:50%;
    transform:translateX(-50%);

    top:-20px;

    max-width:280px;

    background:white;

    color:black;

    padding:12px;

    border-radius:15px;

    opacity:0;

    transition:.3s;

    font-weight:bold;
}

/* 時計 */

.clock-area{

    text-align:center;

    margin-bottom:25px;
}

.clock-title{

    margin-bottom:8px;

    color:#ffd700;

    letter-spacing:4px;
}

.clock{

    font-size:3rem;

    font-family:
    monospace;

    color:#00ffff;

    padding:15px 25px;

    border:2px solid cyan;

    border-radius:15px;

    background:
    rgba(0,0,0,.4);

    box-shadow:
    0 0 20px cyan,
    inset 0 0 20px cyan;

    text-shadow:
    0 0 10px cyan,
    0 0 30px cyan,
    0 0 50px cyan;
}

/* カウントダウン */

.countdown{

    margin-top:15px;

    color:#ffcc00;

    font-size:1rem;
}

/* シェイク */

.shake{

    animation:
    shake .4s;
}

@keyframes shake{

    0%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-8px);}
    80%{transform:translateX(8px);}
    100%{transform:translateX(0);}
}

</style>
</head>

<body>

<div id="mission">

━━━━━━━━━━<br><br>

MISSION<br><br>

山森惇人を<br>
令和の虎へ送り出せ<br><br>

━━━━━━━━━━

</div>

<div>

<div class="title">

🔥 山森惇人くん 頑張って 🔥

</div>

<div class="slogan">

ALL OR NOTHING

</div>

</div>

<div class="character-wrap">

<div class="balloon" id="balloon"></div>

<img
src="character.png"
class="character"
id="character">

<div class="tap">

タップして応援メッセージ

</div>

</div>

<div class="clock-area">

<div class="clock-title">

MISSION CLOCK

</div>

<div id="clock" class="clock">

00:00:00

</div>

<div class="countdown">

本番まで
<span id="countdown"></span>

</div>

</div>

<script>

/* ===== 3分先時計 ===== */

function updateClock(){

    const now = new Date();

    now.setMinutes(
    now.getMinutes()+3);

    const h =
    String(now.getHours())
    .padStart(2,"0");

    const m =
    String(now.getMinutes())
    .padStart(2,"0");

    const s =
    String(now.getSeconds())
    .padStart(2,"0");

    document
    .getElementById("clock")
    .textContent=
    `${h}:${m}:${s}`;
}

updateClock();

setInterval(
updateClock,
1000);

/* ===== カウントダウン ===== */

/*
本番日時をここで変更
*/

const target =
new Date(
"2026-06-20T13:00:00"
);

function updateCountdown(){

    const now =
    new Date();

    const diff =
    target-now;

    if(diff<=0){

        document
        .getElementById(
        "countdown")
        .textContent=
        "開戦";

        return;
    }

    const d =
    Math.floor(
    diff/86400000);

    const h =
    Math.floor(
    diff/3600000)%24;

    const m =
    Math.floor(
    diff/60000)%60;

    const s =
    Math.floor(
    diff/1000)%60;

    document
    .getElementById(
    "countdown")
    .textContent=
    `${d}日 ${h}時間 ${m}分 ${s}秒`;
}

updateCountdown();

setInterval(
updateCountdown,
1000);

/* ===== ボイス ===== */

const messages=[

"ほかほかの豚汁が待っとるぞ",

"天ぷらのぷらってなにが由来なんだろう",

"人には人の乳酸菌",

"いつでも帰っておいで",

"山森惇人、いってこい"

];

const balloon =
document.getElementById(
"balloon");

const synth =
window.speechSynthesis;

document
.getElementById(
"character")
.addEventListener(
"click",
()=>{

document.body.classList
.add("shake");

setTimeout(()=>{

document.body.classList
.remove("shake");

},400);

const msg =
messages[
Math.floor(
Math.random()*
messages.length
)];

balloon.textContent=
msg;

balloon.style.opacity=1;

setTimeout(()=>{

balloon.style.opacity=0;

},2500);

synth.cancel();

const speech =
new SpeechSynthesisUtterance(
msg);

speech.lang=
"ja-JP";

speech.pitch=0.8;

speech.rate=0.9;

synth.speak(
speech);

});

</script>

</body>
</html>
