<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>山森惇人くん 頑張れ！</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: 'Noto Sans JP', sans-serif;
    background: #0d0a08;
    color: #fff;
    overflow-x: hidden;
  }

  /* ── 炎パーティクル ── */
  #flames-bg {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .flame-particle {
    position: absolute;
    bottom: -60px;
    width: 8px; height: 8px;
    border-radius: 50%;
    animation: rise linear infinite;
    opacity: 0;
  }
  @keyframes rise {
    0%   { transform: translateY(0) scale(1); opacity: 0.8; }
    60%  { opacity: 0.5; }
    100% { transform: translateY(-100vh) scale(0.2); opacity: 0; }
  }

  /* ── メインコンテナ ── */
  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 20px 40px;
  }

  /* ── ヒーロータイトル ── */
  .hero {
    text-align: center;
    padding: 44px 0 28px;
  }
  .badge {
    display: inline-block;
    background: #c85000;
    color: #fff;
    font-size: 11px;
    letter-spacing: 3px;
    padding: 5px 18px;
    border-radius: 2px;
    font-weight: 700;
    margin-bottom: 18px;
  }
  .hero-title {
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(2rem, 8vw, 3.2rem);
    font-weight: 900;
    line-height: 1.3;
    color: #fff;
    letter-spacing: -0.02em;
  }
  .hero-title .accent {
    color: #ff6a00;
    text-shadow: 0 0 30px rgba(255,106,0,0.6);
  }

  /* ── キャラクターエリア ── */
  .chara-area {
    margin: 16px 0 24px;
    text-align: center;
    position: relative;
  }
  .chara-wrap {
    display: inline-block;
    cursor: pointer;
    position: relative;
    transition: transform 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .chara-wrap:active { transform: scale(0.96); }
  .chara-img {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(200,80,0,0.5);
    box-shadow: 0 0 40px rgba(255,100,0,0.3);
    display: block;
    transition: box-shadow 0.3s;
  }
  .chara-wrap:active .chara-img {
    box-shadow: 0 0 60px rgba(255,100,0,0.7);
  }
  .tap-hint {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    margin-top: 8px;
    letter-spacing: 2px;
  }

  /* 吹き出し */
  .balloon {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    background: #fff;
    color: #222;
    font-size: 14px;
    font-weight: 700;
    padding: 10px 18px;
    border-radius: 20px;
    white-space: nowrap;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    pointer-events: none;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s;
    opacity: 0;
    z-index: 10;
  }
  .balloon::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: #fff;
  }
  .balloon.show {
    transform: translateX(-50%) scale(1);
    opacity: 1;
  }

  /* ── 時計エリア ── */
  .clock-area {
    width: 100%;
    max-width: 380px;
    margin: 0 auto 8px;
    text-align: center;
  }
  .clock-label {
    font-size: 10px;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .clock-display {
    font-family: 'Courier New', monospace;
    font-size: clamp(2.4rem, 12vw, 4rem);
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #e8e8e8;
    text-shadow: 0 0 30px rgba(255,106,0,0.25);
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 16px 24px;
    display: inline-block;
    width: 100%;
  }
  .clock-display .colon {
    animation: blink 1s step-start infinite;
    opacity: 1;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .clock-sub {
    margin-top: 6px;
    font-size: 11px;
    color: rgba(255,106,0,0.6);
    letter-spacing: 2px;
  }
</style>
</head>
<body>

<!-- 炎パーティクル -->
<div id="flames-bg"></div>

<div class="page">

  <!-- タイトル -->
  <div class="hero">
    <div class="badge">令和の虎YOUTH</div>
    <h1 class="hero-title">
      山森惇人くん<br>
      <span class="accent">頑張って</span>
    </h1>
  </div>

  <!-- キャラクター -->
  <div class="chara-area">
    <div class="chara-wrap" id="charaBtn" onclick="playVoice()">
      <img class="chara-img" src="イラスト.png" alt="山森惇人くん" id="charaImg">
      <div class="balloon" id="balloon"></div>
    </div>
    <p class="tap-hint">タップしてメッセージ ▲</p>
  </div>

  <!-- 時計 -->
  <div class="clock-area">
    <p class="clock-label">— current time —</p>
    <div class="clock-display" id="clock">
      <span id="h">00</span><span class="colon">:</span><span id="m">00</span><span class="colon">:</span><span id="s">00</span>
    </div>
    <p class="clock-sub">＊ 3分早め設定</p>
  </div>

</div>

<script>
// ── 炎パーティクル生成 ──
const container = document.getElementById('flames-bg');
const colors = ['#ff6a00','#ff8c00','#ffb300','#ff4500'];
for (let i = 0; i < 50; i++) {
  const p = document.createElement('div');
  p.className = 'flame-particle';
  const size = Math.random() * 10 + 4;
  p.style.cssText = `
    left: ${Math.random()*100}%;
    width: ${size}px;
    height: ${size}px;
    background: ${colors[Math.floor(Math.random()*colors.length)]};
    animation-duration: ${Math.random()*5+4}s;
    animation-delay: ${Math.random()*6}s;
    filter: blur(${Math.random()*2+1}px);
  `;
  container.appendChild(p);
}

// ── 時計（3分早め）──
function updateClock() {
  const now = new Date(Date.now() + 3*60*1000);
  const pad = n => String(n).padStart(2,'0');
  document.getElementById('h').textContent = pad(now.getHours());
  document.getElementById('m').textContent = pad(now.getMinutes());
  document.getElementById('s').textContent = pad(now.getSeconds());
}
updateClock();
setInterval(updateClock, 1000);

// ── ボイス（機械音）──
const voices = [
  'ほかほかの豚汁が待っとるぞ',
  '天ぷらのぷらってなにが由来なんだろう',
  '人には人の乳酸菌',
  'いつでも帰っておいで',
];
let lastIdx = -1;
const balloon = document.getElementById('balloon');
let balloonTimer = null;

const ctx = new (window.AudioContext || window.webkitAudioContext)();

function playRobotVoice(text) {
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ja-JP';
  utter.pitch = 0.1;     // 低い
  utter.rate  = 0.75;    // ゆっくり
  utter.volume = 1;
  // ボコーダー風にするため音声合成後にWeb Audio Oscillatorを重ねる
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.frequency.value = 80;
  osc.type = 'sawtooth';
  gain.gain.value = 0.04;
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  speechSynthesis.speak(utter);
  utter.onend = () => { osc.stop(); };
}

function playVoice() {
  if (ctx.state === 'suspended') ctx.resume();
  let idx;
  do { idx = Math.floor(Math.random() * voices.length); } while (idx === lastIdx && voices.length > 1);
  lastIdx = idx;
  const text = voices[idx];

  // 吹き出し表示
  balloon.textContent = text;
  balloon.classList.add('show');
  clearTimeout(balloonTimer);
  balloonTimer = setTimeout(() => balloon.classList.remove('show'), 4500);

  // 音声
  speechSynthesis.cancel();
  playRobotVoice(text);
}
</script>
</body>
</html>
